name: Converty cloud SEO and Google indexing monitor
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: converty-public-seo-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obtain short-lived read-only Google token
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/85670106459/locations/global/workloadIdentityPools/converty-seo/providers/converty-github
          service_account: converty-index-monitor@my-concept-riyad.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Check public SEO and report to owner
        env:
          GH_TOKEN: ${{ github.token }}
          GSC_ENABLED: 'true'
          GSC_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='riyadhshajib/converty': raise SystemExit('Unexpected repository')
          for filename in ['cloud-seo-monitor.py','google-index-monitor.py']:
            url='https://api.github.com/repos/'+repo+'/contents/'+filename+'?ref='+os.environ['GITHUB_SHA']
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
            with open(filename,'wb') as f: f.write(base64.b64decode(data['content']))
          subprocess.run(['python3','cloud-seo-monitor.py'],check=True)
          PY
